host: localhost:8080
info:
  contact: {}
  description: Backend application for SubClub
  title: SubClub API
  version: "1.0"
paths:
  /api/v1/account-plans:
    get:
      description: Returns all active SubClub subscription plans
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_web_accountplan.AccountPlanDTO'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
      summary: List account plans
      tags:
      - account-plans
    post:
      consumes:
      - application/json
      description: Creates a new SubClub subscription plan
      parameters:
      - description: Account plan data
        in: body
        name: plan
        required: true
        schema:
          $ref: '#/definitions/internal_web_accountplan.AccountPlanInputDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_web_accountplan.AccountPlanDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
      summary: Create an account plan
      tags:
      - account-plans
  /api/v1/account-plans/{id}:
    delete:
      description: Soft deletes an account plan by ID
      parameters:
      - description: Account Plan ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
      summary: Delete an account plan
      tags:
      - account-plans
    get:
      description: Retrieves a SubClub subscription plan by UUID
      parameters:
      - description: Account Plan ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_accountplan.AccountPlanDTO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
      summary: Get an account plan by ID
      tags:
      - account-plans
    put:
      consumes:
      - application/json
      description: Updates an existing SubClub subscription plan
      parameters:
      - description: Account Plan ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated plan data
        in: body
        name: plan
        required: true
        schema:
          $ref: '#/definitions/internal_web_accountplan.AccountPlanInputDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_accountplan.AccountPlanDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
      summary: Update an account plan
      tags:
      - account-plans
  /api/v1/accounts:
    get:
      description: Returns all accounts
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_web_account.AccountDTO'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
      summary: List accounts
      tags:
      - accounts
    post:
      consumes:
      - application/json
      description: Registers a new account (SubClub client)
      parameters:
      - description: Account data
        in: body
        name: account
        required: true
        schema:
          $ref: '#/definitions/internal_web_account.AccountInputDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_web_account.AccountDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
      summary: Create an account
      tags:
      - accounts
  /api/v1/accounts/{id}:
    delete:
      description: Soft deletes an account by ID
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
      summary: Delete an account
      tags:
      - accounts
    get:
      description: Retrieves an account by UUID
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_account.AccountDTO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
      summary: Get an account by ID
      tags:
      - accounts
    put:
      consumes:
      - application/json
      description: Updates an existing account
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated account data
        in: body
        name: account
        required: true
        schema:
          $ref: '#/definitions/internal_web_account.UpdateAccountInputDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_account.AccountDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
      summary: Update an account
      tags:
      - accounts
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Validates email + password and returns a signed JWT. If the email
        belongs to a single tenant the user is logged into that tenant automatically.
        If it matches multiple tenants a 409 is returned instructing the client to
        use the username + account_slug login instead.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_auth.LoginRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_web_auth.TokenResponseDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
      summary: Authenticate by email
      tags:
      - auth
  /api/v1/auth/login/username:
    post:
      consumes:
      - application/json
      description: Validates username + account_slug + password for a tenant user.
        Use this when the email-based login returns 409 (multiple accounts found).
      parameters:
      - description: Username login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_auth.UsernameLoginRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_web_auth.TokenResponseDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
      summary: Authenticate by username and account slug
      tags:
      - auth
  /api/v1/auth/lookup:
    post:
      consumes:
      - application/json
      description: Returns all accounts that have a user registered with the given
        email. Uses domain-based lookup first; falls back to a parallel tenant scan
        for generic domains (gmail, outlook, etc.)
      parameters:
      - description: Email to look up
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_auth.LookupRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_web_auth.AccountInfoDTO'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
      summary: Lookup accounts by email
      tags:
      - auth
  /api/v1/customers:
    get:
      description: Get a paginated list of customers
      parameters:
      - description: Search by name or email
        in: query
        name: search
        type: string
      - description: Filter by active status
        in: query
        name: active
        type: boolean
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_customer.PaginatedCustomerResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
      summary: List customers
      tags:
      - customers
    post:
      consumes:
      - application/json
      description: Creates a new customer in the system
      parameters:
      - description: Customer data
        in: body
        name: customer
        required: true
        schema:
          $ref: '#/definitions/internal_web_customer.CustomerInputDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_web_customer.CustomerDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
      summary: Create a customer
      tags:
      - customers
  /api/v1/customers/{id}:
    delete:
      description: Soft deletes a customer by ID
      parameters:
      - description: Customer ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
      summary: Delete a customer
      tags:
      - customers
    get:
      description: Retrieves a customer by their UUID
      parameters:
      - description: Customer ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_customer.CustomerDTO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
      summary: Get a customer by ID
      tags:
      - customers
    put:
      consumes:
      - application/json
      description: Updates an existing customer
      parameters:
      - description: Customer ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated customer data
        in: body
        name: customer
        required: true
        schema:
          $ref: '#/definitions/internal_web_customer.CustomerInputDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_customer.CustomerDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_joaofilippe_subclub_internal_web_common.Response'
      summary: Update a customer
      tags:
      - customers
  /api/v1/modules:
    get:
      description: Returns all active modules
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_web_module.ModuleDTO'
            type: array
        "500":
          description: Internal Server Error
          schema:
